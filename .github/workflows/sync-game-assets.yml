name: Sync game assets

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-game-assets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync game assets
        run: node scripts/sync-game-assets.mjs

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain -- assets/decor-catalog.json assets/sprites/decor)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/decor-catalog.json assets/sprites/decor
            VERSION=$(node -p "JSON.parse(require('fs').readFileSync('assets/decor-catalog.json','utf8')).gameVersion")
            git commit -m "chore(assets): sync game v$VERSION"
            git push
          else
            echo "No asset changes."
          fi
